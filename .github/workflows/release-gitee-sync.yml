# Gitee 仓库镜像（可复用 workflow）：把 GitHub 仓库的 commit + tag 镜像到 Gitee。
# 由 .github/workflows/release-assets.yml 在 build 矩阵完成后经 needs: build + uses: 调用，
# 因此本文件 job 不需要自己的 needs / if —— 何时运行由调用方决定。
# secrets 通过调用上下文自动继承（secrets: inherit）。
#
# 仅镜像源码与 tag——不再上传安装包到 Gitee Release、不生成 Gitee 专属 manifest：
# 安装包体积增大后 Gitee Release 上传慢且常失败；app updater 的 Gitee endpoint 已移除，仅从 GitHub 更新。
name: Sync to Gitee

on:
  workflow_call:

jobs:
  sync-gitee:
    name: Mirror to Gitee
    runs-on: ubuntu-latest
    steps:
      # ---------- 前置：secrets 齐全性校验（缺失则硬失败）----------
      - name: Verify Gitee secrets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_USER" ] || [ -z "$GITEE_PRIVATE_KEY" ]; then
            echo "::error::Gitee secrets missing (GITEE_TOKEN / GITEE_USER / GITEE_PRIVATE_KEY) — mirror cannot run. Configure them in repo Settings → Secrets → Actions."
            exit 1
          fi

      # ---------- 镜像 commit + tag 到 Gitee（force_update 强推含 tags） ----------
      - name: Mirror commits and tags to Gitee
        # 锁定 v1.5（Docker 实现，无 setup-uv）：@master 的 composite 实现会在非 Python 仓库触发 setup-uv 缓存告警。
        uses: Yikun/hub-mirror-action@v1.5
        with:
          src: 'github/${{ github.repository_owner }}'
          dst: 'gitee/${{ secrets.GITEE_USER }}'
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: ${{ github.event.repository.name }}
          force_update: true
          src_account_type: org
          dst_account_type: org
          clone_style: ssh
