# PR / push 检查：守住 Rust→TS 类型绑定不漂移。
#
# 为何需要：src/shared/bindings.ts 由 gen:bindings 从 #[tauri::command] 签名 + types.rs 生成并提交进 git，
# 构建期不再自动重新生成（见 package.json 的 web:dev/web:build）。故类型改动后必须手动 pnpm gen:bindings
# 同步本文件，否则前后端类型会静默漂移。本 workflow 跑 verify:bindings（重新生成并断言 git diff 为空）
# 作为兜底，把漂移拦在 PR 阶段。
#
# 流程须先构建 host triple 的 Go sidecar：gen:bindings 是 host 构建（cargo run 不带 --target），tauri-build 的 build script
# 会按 host triple 找 sidecar，缺失即硬报错。macos-latest runner 上 host==target，一份 host triple 即可。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-bindings:
    name: Verify Rust→TS bindings in sync
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # 必须在 setup-node 之前：setup-node 的 pnpm cache 需先读到 pnpm 版本
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # gen:bindings 走 host 构建，需要 host triple 的 sidecar。setup-go 按 go.mod 锁定 Go 版本，
      # 并按 src-server/go.sum 缓存模块（src-server 含 gin/gorm 等外部依赖，缓存命中省去重复下载）。
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src-server/go.mod
          cache-dependency-path: src-server/go.sum

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install app dependencies
        run: pnpm install

      - name: Download Go modules
        run: go -C src-server mod download

      - name: Build Go sidecar (host triple)
        run: pnpm server:release

      - name: Verify bindings in sync
        run: pnpm verify:bindings
